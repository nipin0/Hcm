# docker-compose.yml — HCM v2 全栈部署编排
# 版本: v1.0 | 基于 PRD v1.3 附录 B
name: hcm-v2

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: hcm_v2
      POSTGRES_USER: hcm
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hcm_dev_pwd}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./deploy/init_config_metadata.sql:/docker-entrypoint-initdb.d/02-init_config_metadata.sql
      - ./deploy/init_event_calendar.sql:/docker-entrypoint-initdb.d/03-init_event_calendar.sql
      - ./deploy/init_symbol_meta.sql:/docker-entrypoint-initdb.d/04-init_symbol_meta.sql
    ports:
      - "5432:5432"
    networks:
      - hcm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hcm -d hcm_v2"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - hcm-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  hcm-gateway:
    build:
      context: .
      dockerfile: hcm-gateway/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis:6379
      - DB_URL=postgresql://hcm:${DB_PASSWORD:-hcm_dev_pwd}@postgres:5432/hcm_v2
      - MT5_PATH=/app/mt5
      - GRPC_PORT=8004
      - WS_PORT=8005
    ports:
      - "8004:8004"
      - "8005:8005"
    networks:
      - hcm-network
    volumes:
      # [2026-08-28 P0-3] gateway 在未接入 MT5 桥时禁止伪造成交：原实现返回
      # code=0 + 由 time.time() 派生的伪 ticket，调用方无从辨别，遂把信号标记为
      # 已成交并产生 403 条 "Order timeout" 告警；一旦接入真实通道将与主机侧桥
      # 双重开仓。绑定挂载使该修复跨容器 recreate 持久（无网环境无法 rebuild 镜像）。
      - ./hcm-gateway/gateway/grpc_server.py:/app/gateway/grpc_server.py
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  hcm-collector:
    build:
      context: .
      dockerfile: hcm-collector/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      hcm-gateway:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis:6379
      - DB_URL=postgresql://hcm:${DB_PASSWORD:-hcm_dev_pwd}@postgres:5432/hcm_v2
      - GATEWAY_WS_URL=ws://hcm-gateway:8005
      - SERVICE_PORT=8001
    ports:
      - "0.0.0.0:8001:8001"
    networks:
      - hcm-network
    volumes:
      # 2026-08-05 (D4): 源码即权威，跨 recreate 持久（与 signal-tower/web 同模式）
      - ./hcm-collector/main.py:/app/main.py
      - ./hcm-collector/collector:/app/collector
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  hcm-signal-tower:
    build:
      context: .
      dockerfile: hcm-signal-tower/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      hcm-collector:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis:6379
      - DB_URL=postgresql://hcm:${DB_PASSWORD:-hcm_dev_pwd}@postgres:5432/hcm_v2
      # DeepSeek 凭证改由配置中心(PG hcm_config.metadata)经 config_provider 注入，
      # 不再读取 .env，遵守"配置真源在 PG/Redis、禁用硬编码"纪律。
      - SERVICE_PORT=8002
    ports:
      - "0.0.0.0:8002:8002"
    networks:
      - hcm-network
    # 【2026-08-24 时钟同步】signal-tower 生成信号时间戳(UTC)，若其容器时钟比宿主(桥)
    # 快/慢数百秒，信号被桥 _is_signal_fresh 误判"未来/过期"拒绝 → 错过下单。
    # 授予 SYS_TIME 使容器内可 date -s 校准（配合启动同步），根治时钟偏差。
    cap_add:
      - SYS_TIME
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      # 绑定挂载源码（无网环境无法 rebuild 镜像）：使主号周期重解析等修复跨容器 recreate 持久生效
      - ./hcm-signal-tower/signal_tower/scheduler.py:/app/signal_tower/scheduler.py
      # [2026-08-04 治本③] 连亏制动时间衰减：consecutive_loss 老旧自动清零，破除永久死锁；绑定挂载跨 recreate 持久
      - ./hcm-signal-tower/signal_tower/risk_state_sync.py:/app/signal_tower/risk_state_sync.py
      # [2026-07-30] Bar 质量分纯函数：信号塔处理高质量 K 线数据，默认不影响信号（计算层）
      - ./hcm-signal-tower/signal_tower/bar_quality.py:/app/signal_tower/bar_quality.py
      # 手动跟单同步修复：手动镜像动作(action/close_mode/close_ticket/magic)透传到 signal:stream
      - ./hcm-signal-tower/signal_tower/manual_mode.py:/app/signal_tower/manual_mode.py
      - ./hcm-signal-tower/signal_tower/signal_publisher.py:/app/signal_tower/signal_publisher.py
      # 五维模型硬删除(2026-07-24)：main.py 移除 AiInvoker 实例化、__init__.py 移除 ai_invoker 导出，跨 recreate 持久
      - ./hcm-signal-tower/main.py:/app/main.py
      - ./hcm-signal-tower/signal_tower/__init__.py:/app/signal_tower/__init__.py
      # [2026-07-24 审计加固] 冷却键/强趋势门槛安全默认防御（配置丢失不退化）：跨 recreate 持久
      - ./hcm-signal-tower/signal_tower/scoring_engine.py:/app/signal_tower/scoring_engine.py
      # [2026-07-31] H1 防火墙方向补全修复：惯性分支保留趋势 regime 时补全 trend_direction，
      # 否则逆势单漏过；绑定挂载跨 recreate 持久
      - ./hcm-signal-tower/signal_tower/h1_regime_classifier.py:/app/signal_tower/h1_regime_classifier.py
      - ./hcm-signal-tower/signal_tower/co_source.py:/app/signal_tower/co_source.py
      # [2026-08-08] 和乘幂(hexp)独立信号源引擎：跨 recreate 持久（新文件，非镜像烘焙）
      - ./hcm-signal-tower/signal_tower/hexp_engine.py:/app/signal_tower/hexp_engine.py
      - ./hcm-signal-tower/signal_tower/micro_state.py:/app/signal_tower/micro_state.py
      - ./hcm-signal-tower/signal_tower/precision_entry.py:/app/signal_tower/precision_entry.py
      # [2026-08-26] NEUTRAL 模糊区次级确认(hurst+BBW)：regime_classifier 新增 hurst 参数
      # 与 fuzzy 逻辑，必须绑定挂载跨 recreate 持久，否则镜像旧版无 hurst 参数导致
      # scheduler(挂载新版传 hurst) 调用崩溃 "unexpected keyword argument 'hurst'"
      - ./hcm-signal-tower/signal_tower/regime_classifier.py:/app/signal_tower/regime_classifier.py
      # [2026-08-14 闭环] quality_gate 融合闸门 + ai_async_client(DeepSeek 校准融合)：LightGBM+DeepSeek 闭环裁决，跨 recreate 持久
      - ./hcm-signal-tower/signal_tower/quality_gate.py:/app/signal_tower/quality_gate.py
      - ./hcm-signal-tower/signal_tower/ai_async_client.py:/app/signal_tower/ai_async_client.py
      # [2026-09-04] 反转头每日绩效聚合（新文件非镜像烘焙，缺则 ModuleNotFoundError 崩溃）：绑定挂载跨 recreate 持久
      - ./hcm-signal-tower/signal_tower/rev_daily.py:/app/signal_tower/rev_daily.py
      # [2026-09-09] RANGE 均值回归策略（新文件非镜像烘焙，缺则 scheduler 的
      # `from signal_tower import range_strategy` 触发 ModuleNotFoundError 崩溃）：
      # 单仓不加仓（实证：对称1:1胜率70~81%；递增摊平需66.7%而实测50~65%→负期望）。
      # 开关 range.enabled 默认 false（影子），绑定挂载跨 recreate 持久。
      - ./hcm-signal-tower/signal_tower/range_strategy.py:/app/signal_tower/range_strategy.py
      # [P1] 轻量 DeepSeek 客户端：供校准诊断生成自然语言报告（shared 包镜像内置，单文件挂载跨 recreate 持久）
      - ./shared/llm_client.py:/app/shared/llm_client.py
      # [2026-08-17 B7] RedisClient 封装类补 exists 方法（DeepSeek run_loop 检测触发标志依赖），
      # 同 llm_client 模式挂载使容器使用新码，跨 recreate 持久
      - ./shared/redis_client.py:/app/shared/redis_client.py
      # [2026-09-08 审计] 指标计算：数据不足时原返回 adx=20.0（默认恰好落在"有趋势"
      # 区间，门槛 18）→ 用假指标出单；改为返回中性值(adx=0)。挂载使修复进容器。
      - ./hcm-signal-tower/signal_tower/indicator_calculator.py:/app/signal_tower/indicator_calculator.py
      # [2026-08-21] ConfigProviderV3.get_current（只读 current_value、不做 PG default_value
      # 兜底）：根治「和乘幂配置保存刷新又复原」。shared 包镜像内置，须单文件挂载才进容器，
      # 否则 hexp_engine/web 的 get_current 调用抛 AttributeError → 回退默认、读不到用户调优值。
      - ./shared/config_provider.py:/app/shared/config_provider.py

  hcm-market-intel:
    build:
      context: .
      dockerfile: hcm-market-intel/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis:6379
      - DB_URL=postgresql://hcm:${DB_PASSWORD:-hcm_dev_pwd}@postgres:5432/hcm_v2
      - FRED_API_KEY=${FRED_API_KEY:-}
      - CME_API_KEY=${CME_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - MARKET_INTEL_STUB_MODE=false
      - SERVICE_PORT=8006
    ports:
      - "8006:8006"
    networks:
      - hcm-network
    volumes:
      # 绑定挂载源码（无网环境无法 rebuild 镜像）：使「关闭 StubMode + 写状态标记键」
      # 修复跨容器 recreate 持久生效（否则容器重建回退镜像版丢失修复）
      - ./hcm-market-intel/main.py:/app/main.py
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8006/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  hcm-risk-engine:
    build:
      context: .
      dockerfile: hcm-risk-engine/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis:6379
      - DB_URL=postgresql://hcm:${DB_PASSWORD:-hcm_dev_pwd}@postgres:5432/hcm_v2
      - SERVICE_PORT=8007
    ports:
      - "8007:8007"
    networks:
      - hcm-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8007/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      # 绑定挂载源码（无网环境无法 rebuild 镜像）：使手动跟单生命周期动作免规则链放行、透传 action/close_mode/close_ticket 等修复跨容器 recreate 持久生效
      - ./hcm-risk-engine/risk_engine/stream_consumer.py:/app/risk_engine/stream_consumer.py
      # 风控配置崩溃降级 + 60s 热重载修复：配置缺失不再 raise、未加载时降级放行、改 PG 配置即生效
      - ./hcm-risk-engine/risk_engine/rule_chain.py:/app/risk_engine/rule_chain.py
      - ./hcm-risk-engine/main.py:/app/main.py
      # [2026-09-08 审计] 启动安全自检键对齐：CRITICAL_SAFETY_KEYS 原本校验的是
      # 僵尸键（risk_cool_minutes 等），而风控实际读 risk.cooldown_minutes /
      # risk.max_lot_per_trade / risk.max_total_exposure / risk.max_concurrent_signals /
      # risk.max_daily_loss / risk.margin_call_level → 真实阈值误配为 0 时自检不拦。
      # shared 包是镜像内置的，须单文件挂载才进容器（与 signal-tower 同模式）。
      - ./shared/redis_client.py:/app/shared/redis_client.py
      # 风控决策引擎：同向冷却(risk_cool_minutes)移出软规则改为硬规则 REJECT，绑定挂载跨 recreate 持久
      - ./hcm-risk-engine/risk_engine/decision.py:/app/risk_engine/decision.py

  hcm-dispatcher:
    build:
      context: .
      dockerfile: hcm-dispatcher/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
      hcm-gateway:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis:6379
      - DB_URL=postgresql://hcm:${DB_PASSWORD:-hcm_dev_pwd}@postgres:5432/hcm_v2
      - GATEWAY_GRPC_URL=hcm-gateway:8004
      - SERVICE_PORT=8008
    ports:
      - "8008:8008"
    networks:
      - hcm-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8008/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      # 绑定挂载源码（无网环境无法 rebuild 镜像）：使「主号+跟单号都通知钉钉」修复跨容器 recreate 持久生效
      - ./hcm-dispatcher/dispatcher/execution_notifier.py:/app/dispatcher/execution_notifier.py
      - ./hcm-dispatcher/dispatcher/notifier.py:/app/dispatcher/notifier.py
      # [2026-08-28 P0-2/P0-5] dispatcher 下单职责闸门：signal:risk_passed 上桥的
      # group:{6,9,23,24,35} 与 dispatcher-group 争抢同一批信号，且 gateway 无 MT5 连接
      # → dispatcher 下单全部落在伪成交分支。实测近 14 天全部真实成交均来自桥
      # （mt5_ticket 无一为空/0），故 dispatcher 默认只消费通知、不下单
      # （可经配置中心 dispatch.execution_enabled 热开）；另加信号年龄闸门，
      # 消费组 start_id 由 "0" 改 "$"。绑定挂载跨 recreate 持久。
      - ./hcm-dispatcher/dispatcher/stream_consumer.py:/app/dispatcher/stream_consumer.py

  hcm-copy-trading:
    build:
      context: .
      dockerfile: hcm-copy-trading/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      hcm-gateway:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    environment:
      - REDIS_URL=redis://redis:6379
      - DB_URL=postgresql://hcm:${DB_PASSWORD:-hcm_dev_pwd}@postgres:5432/hcm_v2
      - GATEWAY_GRPC_URL=hcm-gateway:8004
      - SERVICE_PORT=8009
    ports:
      - "8009:8009"
    networks:
      - hcm-network
    volumes:
      # [2026-08-28 P1-13] 跟单下单幂等键修复：client_id 去掉毫秒时间戳，改为仅由
      # (account_id, signal_id) 构成，使重试与 PUB/SUB 兜底路径复用同一幂等键，
      # 消除"gRPC 已成交但回包超时 → 兜底再下一单"的重复开仓。
      # 绑定挂载使该修复跨容器 recreate 持久（无网环境无法 rebuild 镜像）。
      - ./hcm-copy-trading/copy_trading/order_executor.py:/app/copy_trading/order_executor.py
      # 2026-08-29：默认关闭 copy-trading 真实下单（跟单开仓统一由跟单桥负责），
      # 同目录 stream_consumer.py 加开关 COPY_TRADING_ORDER_EXECUTION_ENABLED，挂载后 recreate 持久。
      - ./hcm-copy-trading/copy_trading/stream_consumer.py:/app/copy_trading/stream_consumer.py
      # [2026-09-08 审计] 跟单手数：lot_mode 大小写不匹配（DB 小写 vs LotMode.*.value
      # 大写）导致所有手数模式静默失效、恒按主号 1:1 下单。挂载使修复进容器。
      - ./hcm-copy-trading/copy_trading/lot_calculator.py:/app/copy_trading/lot_calculator.py
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8009/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  hcm-web:
    build:
      context: .
      dockerfile: hcm-web/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis:6379
      - DB_URL=postgresql://hcm:${DB_PASSWORD:-hcm_dev_pwd}@postgres:5432/hcm_v2
      - SERVICE_PORT=8000
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret-change-in-production}
    ports:
      - "0.0.0.0:8000:8000"
    networks:
      - hcm-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      # 绑定挂载源码（无网环境无法 rebuild 镜像）：使启用/停用开关即时广播等修复跨容器 recreate 持久生效
      - ./hcm-web/web/api/system.py:/app/web/api/system.py
      # 平仓配置 API：时段系数(亚盘/欧盘/美盘)开关在此实现，绑定挂载跨 recreate 持久
      - ./hcm-web/web/api/close.py:/app/web/api/close.py
      # 评分阈值(公用) API：live_override 反转救援等参数经此 GET/PUT，绑定挂载跨 recreate 持久
      - ./hcm-web/web/api/signal_tower.py:/app/web/api/signal_tower.py
      # 风险参数 API：经 config_provider.set 双写 PG+Redis；显式 hset 双写保险已合并进源码，
      # 绑定挂载使「风险参数即时双写」跨 recreate 持久（否则容器重建回退镜像版丢失双写保险）
      - ./hcm-web/web/api/risk.py:/app/web/api/risk.py
      # 跟单关系 API：含空串→默认值容错(消除创建 422)；绑定挂载使该修复跨 recreate 持久
      - ./hcm-web/web/api/copy.py:/app/web/api/copy.py
      # [2026-08-28] 引擎模式配置 API（原 cosource.py 重命名；双源信号整体下线后
      # 仅保留 signal.active_model 引擎切换职责）。经 config_provider.set 双写
      # PG(metadata)+Redis(hcm:config:v2)+PUB；绑定挂载跨 recreate 持久。
      - ./hcm-web/web/api/engine_mode.py:/app/web/api/engine_mode.py
      # [2026-08-08] 和乘幂(hexp)独立信号源配置 API：PG(metadata)+Redis(hcm:config:v2) 双写 + PUB；绑定挂载跨 recreate 持久
      - ./hcm-web/web/api/hexp.py:/app/web/api/hexp.py
      # [2026-08-14] AI 信号质量模块配置 API（ai.* 命名空间，新文件非镜像烘焙）：绑定挂载跨 recreate 持久
      - ./hcm-web/web/api/ai_config.py:/app/web/api/ai_config.py
      # [2026-08-14] AI 报表聚合 API（只读，新文件非镜像烘焙）：绑定挂载跨 recreate 持久
      - ./hcm-web/web/api/ai_report.py:/app/web/api/ai_report.py
      # [2026-08-29] AI 中枢监控 API（三头实时运作+DeepSeek 效果，只读，新文件非镜像烘焙）：绑定挂载跨 recreate 持久
